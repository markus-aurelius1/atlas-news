<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The Tars mark: four slabs standing together as a T. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#1e2540"/>
      <stop offset="58%" stop-color="#0e1223"/>
      <stop offset="100%" stop-color="#070913"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#f2c46d" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#f2c46d" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#f2c46d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6ae"/>
      <stop offset="100%" stop-color="#e6a940"/>
    </linearGradient>
    <linearGradient id="slab-short" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6ae"/>
      <stop offset="100%" stop-color="#efbc5c"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="380" fill="url(#glow)"/>
  <rect x="218" y="250" width="120" height="184" rx="30" fill="url(#slab-short)"/>
  <rect x="374" y="250" width="120" height="524" rx="30" fill="url(#slab)"/>
  <rect x="530" y="250" width="120" height="524" rx="30" fill="url(#slab)"/>
  <rect x="686" y="250" width="120" height="184" rx="30" fill="url(#slab-short)"/>
</svg>
